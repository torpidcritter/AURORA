name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  backend:
    name: Backend (lint, tests, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: aurora-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora
          POSTGRES_DB: aurora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aurora" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: aurora-backend/requirements*.txt
      - name: Install
        run: |
          pip install torch==2.14.1 --index-url "$TORCH_INDEX"
          pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations match models
        env:
          DATABASE_URL: postgresql+psycopg://aurora:aurora@localhost:5432/aurora_test
        run: |
          alembic upgrade head
          alembic check
      - name: Tests
        env:
          DATABASE_URL: postgresql+psycopg://aurora:aurora@localhost:5432/aurora_test
        run: pytest -q
      - name: Dependency audit
        run: pip-audit -r requirements.txt --progress-spinner off

  frontend:
    name: Frontend (types, lint, tests, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aurora-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: aurora-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm audit --audit-level=high

  e2e:
    name: End-to-end (browser against API + worker)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora
          POSTGRES_DB: aurora_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aurora" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://aurora:aurora@localhost:5432/aurora_e2e
      REDIS_URL: redis://localhost:6379/0
      API_CORS_ORIGINS: http://localhost:3100
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      LOG_JSON: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: aurora-backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: aurora-frontend/package-lock.json
      - name: Generate throwaway secrets for this run
        run: |
          echo "SECRET_KEY=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          PW="E2e-$(openssl rand -hex 12)"
          echo "::add-mask::$PW"
          echo "BOOTSTRAP_ADMIN_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_EMAIL=admin@example.com" >> "$GITHUB_ENV"
      - name: Backend install, migrate, seed synthetic demo data
        working-directory: aurora-backend
        run: |
          pip install torch==2.14.1 --index-url "$TORCH_INDEX"
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.cli bootstrap
          python -m app.cli seed-demo --products 12 --days 240
      - name: Start API and worker
        working-directory: aurora-backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8100 > ../api.log 2>&1 &
          nohup celery -A app.workers.celery_app worker -Q default,training -c 2 > ../worker.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8100/health/ready && break; sleep 2; done
      - name: Frontend build and start
        working-directory: aurora-frontend
        env:
          API_URL: http://127.0.0.1:8100
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run build
          nohup npx next start -p 3100 > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3100/login && break; sleep 2; done
      - name: Playwright
        working-directory: aurora-frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs on failure
        if: failure()
        run: tail -n 200 api.log worker.log web.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: aurora-frontend/test-results
          retention-days: 7
