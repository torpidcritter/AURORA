# Example Prometheus configuration for Aurora (ADR-048). Replace the target with your API's address.
# The API requires a bearer token on /metrics when METRICS_TOKEN is set: put the same value in the file below.
global:
  scrape_interval: 30s
rule_files:
  - alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: aurora-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/aurora-metrics-token
    static_configs:
      - targets: ["api:8100"]
