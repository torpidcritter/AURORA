# Local / single-host deployment of the full Aurora stack.
#   cp .env.example .env   # then fill in the required secrets
#   docker compose up -d --build
#   docker compose run --rm api python -m app.cli bootstrap     # first admin (once)
#   COMPOSE_PROFILES=s3 docker compose up -d                    # optional: store files in a local MinIO
# Ports bind to 127.0.0.1 only; put a TLS-terminating reverse proxy in front for remote access.
#
# Two database logins: `migrate` connects as the schema owner (POSTGRES_PASSWORD), applies migrations and then grants
# the runtime role. The API, worker and beat connect as that role (APP_DB_PASSWORD), which can read and write rows
# but cannot change the schema. The owner password is never given to the long-running containers.
name: aurora

x-backend: &backend
  build: ./aurora-backend
  image: aurora-backend:local
  restart: unless-stopped
  environment: &backend-env
    ENVIRONMENT: ${ENVIRONMENT:-production}
    DB_HOST: db
    DB_NAME: aurora
    DB_USER: aurora_app
    DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
    API_CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:3100}
    FRONTEND_URL: ${PUBLIC_URL:-http://localhost:3100}
    BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
    BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ARTIFACT_DIR: /data/artifacts
    # Optional settings: empty values fall back to the application defaults (see aurora-backend/.env.example).
    LOG_LEVEL: ${LOG_LEVEL:-}
    API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-}
    LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-}
    MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-}
    STORAGE_BACKEND: ${STORAGE_BACKEND:-}
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
    S3_BUCKET: ${S3_BUCKET:-}
    S3_REGION: ${S3_REGION:-}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-}
    SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:-}
    SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:-}
    SHOPIFY_API_SECRET_PREVIOUS: ${SHOPIFY_API_SECRET_PREVIOUS:-}
    SHOPIFY_REDIRECT_URL: ${SHOPIFY_REDIRECT_URL:-http://localhost:8100/shopify/callback}
    SHOPIFY_WEBHOOK_BASE_URL: ${SHOPIFY_WEBHOOK_BASE_URL:-}
    TOKEN_ENCRYPTION_KEYS: ${TOKEN_ENCRYPTION_KEYS:-}
    METRICS_TOKEN: ${METRICS_TOKEN:-}
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ALERT_MIN_SEVERITY: ${ALERT_MIN_SEVERITY:-}
    TRAINING_MAX_EPOCHS: ${TRAINING_MAX_EPOCHS:-}
    TRAINING_TIME_LIMIT_S: ${TRAINING_TIME_LIMIT_S:-}
  volumes:
    - artifacts:/data/artifacts
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurora
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Applies database migrations, then exits. In production run this step deliberately (see docs/RUNBOOK.md).
  # Then it creates or refreshes the runtime role, so new tables are granted too.
  migrate:
    <<: *backend
    restart: "no"
    environment:
      <<: *backend-env
      DB_USER: aurora
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_ROLE: aurora_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli grant-app-role"]

  api:
    <<: *backend
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: ${API_WORKERS:-2}
      # The web container is the only caller; trust X-Forwarded-For from the compose network only.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "default,training", "--concurrency", "2", "--loglevel", "INFO"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: ./aurora-frontend
    image: aurora-frontend:local
    restart: unless-stopped
    environment:
      API_URL: http://api:8100
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      api: { condition: service_healthy }

  # Optional S3-compatible object storage for local development (COMPOSE_PROFILES=s3). Set STORAGE_BACKEND=s3,
  # S3_ENDPOINT_URL=http://minio:9000 and S3_ACCESS_KEY / S3_SECRET_KEY (8+ characters) in .env. For shared or
  # production environments use a managed S3 service with a key scoped to one bucket instead of these root credentials.
  # MinIO no longer publishes community images (minio/minio was removed from Docker Hub); this is Bitnami's last
  # build, frozen since 2025-08 and receiving no security fixes. Development only.
  minio:
    profiles: ["s3"]
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-}
    volumes:
      - miniodata:/bitnami/minio/data
    ports:
      - "127.0.0.1:9001:9001"   # console

volumes:
  miniodata:
  pgdata:
  redisdata:
  artifacts:
